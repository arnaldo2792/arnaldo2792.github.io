<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link href="/css/main.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
  <style>
    {% for message in config.extra.index.messages %}
    .home-message-{{loop.index}} {
        overflow: hidden;
        white-space: nowrap;
        width: 0;
        animation: home-message-{{loop.index}} {{message.duration}} steps({{message.steps}}) {{message.delay}} forwards;
      }
    @keyframes home-message-{{loop.index}} {
        from {
          width: 0;
        }
        to {
          width: {{message.text | length}}ch;
        }
      }
    {% endfor %}
  </style>
</head>
<body class="flex flex-col h-screen justify-between">
  <!-- NAVBAR -->
  <header class="border-green/50 border-b">
    <nav class="relative after:pointer-events-none after:absolute after:inset-x-0 after:bottom-0 after:h-px">
      <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between">
          <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
            <div class="flex-shrink-0 flex items-center ml-2">
              <a class="text-xl md:text-2xl font-bold">
                <span class="glitch" data-text="{{config.extra.navbar.title}}">
                  {{config.extra.navbar.title}}
                </span>
              </a>
            </div>
            <div class="hidden sm:ml-6 sm:block">
              <div class="flex space-x-4">
                {% for item in config.extra.navbar.items %}
                  <a href="{{ item.url }}" class="px-3 py-2 text-sm font-medium hover:text-white transition-colors duration-300 tracking-widest">
                    ~❯ {{ item.name | upper }}
                  </a>
                {% endfor %}
              </div>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

  {% block main %}
  {% endblock main %}

  <footer class="max-w-7xl mx-auto relative pt-1 px-2 border-gray-300 dark:border-gray-200 w-full">
    {% block footer %}
    {% endblock footer %}

    {% if config.extra.footer.include_cc_license %}
      <div class="mt-16 border-t border-green/50 flex flex-col items-center">
        <div class="sm:w-2/3 text-center py-6">
            <p class="text-sm text-green/80 ">
              This work is licensed under
              <a href="https://creativecommons.org/licenses/by-sa/4.0/" class="hover:text-white transition-colors duration-300 tracking-widest" target="_blank">
                CC BY-SA 4.0
              </a>
            </p>
        </div>
      </div>
    {% endif %}
  </footer>
</body>
</html>
