{% extends "layout.html" %}

{% block main %}

<main>
  <section id="home" class="py-20 md:py-32 relative">
    <div class="max-w-7xl mx-auto relative z-10">
      <div class="max-w-4xl mx-auto text-center">
        <h1 class="text-3xl md:text-5xl lg:text-6xl font-bold mb-6 glitch" data-text="{{ config.extra.index.title | upper }}">
          {{ config.extra.index.title | upper }}
        </h1>
        {% for message in config.extra.index.messages %}
        <p class="home-message-{{loop.index}} text-lg md:text-xl text-green/80 leading-relaxed max-w-4xl mx-auto {% if message.bold %}font-bold {%endif %}" >
            {{message.text}}
          </p>
        {% endfor %}
      </div>
    </div>
  </section>
</main>

{% endblock main %}
